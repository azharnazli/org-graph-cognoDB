server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA routing: unknown paths fall through to index.html so React Router
  # handles /people/:id style URLs on refresh.
  location / {
    try_files $uri /index.html;
  }

  # Same-origin API: forward /api/* to the backend container. The URI is
  # passed through untouched (backend expects the /api prefix).
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
